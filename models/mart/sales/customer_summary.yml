version: 2

models:
  - name: customer_summary
    description: "{{ doc('customer_summary') }}"

    columns:
      - name: customer_id
        description: Unique identifier for the customer (primary key).
        data_tests:
          - unique
          - not_null

      - name: customer_full_name
        description: Full name of the customer (first_name + last_name).
        data_tests:
          - not_null

      - name: customer_city
        description: City of the customer's billing address.

      - name: customer_state
        description: US state of the customer's billing address.

      - name: total_order_count
        description: >
          Total number of orders placed by this customer across all statuses
          (Pending, Processing, Rejected, Completed).
        data_tests:
          - not_null

      - name: first_order_date
        description: Date of the customer's first order (any status).
        data_tests:
          - not_null

      - name: last_order_date
        description: Date of the customer's most recent order (any status).
        data_tests:
          - not_null

      - name: completed_order_count
        description: >
          Number of completed orders (status = 4) placed by this customer.
          0 for customers with no completed orders.
        data_tests:
          - not_null

      - name: lifetime_value
        description: >
          Total revenue generated by this customer across all completed orders,
          aggregated from order_revenue in int_orders__with_revenue.
          0 for customers with no completed orders. Rounded to 2 decimal places.
        data_tests:
          - not_null

      - name: avg_basket
        description: >
          Average revenue per completed order for this customer
          (lifetime_value / completed_order_count).
          NULL for customers with no completed orders.
