version: 2

models:
  - name: stg_localbike__customers
    description: "{{ doc('stg_localbike__customers') }}"

    data_tests:
      - not_null:
          column_name: customer_id
      - unique:
          column_name: customer_id

    columns:
      - name: customer_id
        description: Primary key — unique identifier for each customer.

      - name: first_name
        description: Customer's first name.

      - name: last_name
        description: Customer's last name.

      - name: email_hash
        description: >
          SHA-256 hash of the customer's email address (see ADR-024).
          May be null — preserves the source column's nullability.
          Not reversible; if a legitimate need to recover the original email
          ever arises, move to tokenization with a secured lookup table
          instead of reverting to plain text.
