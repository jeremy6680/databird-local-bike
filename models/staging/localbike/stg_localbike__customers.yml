version: 2

models:
  - name: stg_localbike__customers
    description: >
      Staged customer profiles from the Local Bike source dataset.
      One row per customer. Light cleaning only — no joins, no aggregations.
      zip_code is cast from INTEGER to STRING (it is a code, not a number).

    data_tests:
      - not_null:
          column_name: customer_id
      - unique:
          column_name: customer_id

    columns:
      - name: customer_id
        description: Primary key — unique identifier for each customer.

      - name: first_name
        description: Customer's first name.

      - name: last_name
        description: Customer's last name.

      - name: phone
        description: Customer's phone number. May be null.

      - name: email
        description: Customer's email address. May be null.

      - name: street
        description: Street address of the customer.

      - name: city
        description: City of the customer's address.

      - name: state
        description: US state of the customer's address (abbreviated, e.g. CA, NY, TX).

      - name: zip_code
        description: >
          ZIP code of the customer's address.
          Cast to STRING from INTEGER in the source — treated as a code, not a number.
