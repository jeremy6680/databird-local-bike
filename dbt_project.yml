name: local_bike
version: "1.0.0"
config-version: 2

# --------------------------------------------------------
# dbt profile to use — matches the profile name in profiles.yml
# --------------------------------------------------------
profile: local_bike

# --------------------------------------------------------
# Path configuration — dbt defaults, kept explicit for clarity
# --------------------------------------------------------
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# --------------------------------------------------------
# Compilation artifacts — always git-ignored
# --------------------------------------------------------
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# --------------------------------------------------------
# Default materialisation per layer
# All overrides must be declared in the model's {{ config() }} block
# and justified in DECISIONS.md
# --------------------------------------------------------
models:
  local_bike:
    # Persist column and model descriptions to BigQuery
    # Enables descriptions to appear in the BigQuery UI
    +persist_docs:
      relation: true
      columns: true

    # Staging — light cleaning only, always views
    staging:
      +materialized: view
      +schema: staging

    # Intermediate — joins and business logic, always views
    intermediate:
      +materialized: view

    # Mart — aggregated, BI-ready tables connected to Metabase
    # Exception: orders.sql overrides this with incremental (see DECISIONS.md ADR-008)
    mart:
      +materialized: table
